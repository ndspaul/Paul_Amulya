<app-flower-rain></app-flower-rain>
<app-gold-dust></app-gold-dust>
<app-confetti [fire]="confettiFired"></app-confetti>

<!-- Envelope Invitation Opener -->
<app-invitation (opened)="onInvitationOpened()">

  <div class="page visible">

    <!-- Hero: full-screen image with soft overlay -->
    <app-hero></app-hero>

    <!-- Monogram -->
    <section class="demo-section reveal">
      <app-monogram></app-monogram>
    </section>

    <!-- Floral divider -->
    <app-floral-divider class="reveal"></app-floral-divider>

    <!-- Couple portrait + Bible verses -->
    <section class="demo-section reveal">
      <app-couple></app-couple>
    </section>

    <app-floral-divider class="reveal"></app-floral-divider>

    <!-- Countdown -->
    <section class="demo-section reveal">
      <app-count-down></app-count-down>
    </section>

    <app-floral-divider class="reveal"></app-floral-divider>

    <!-- Venue -->
    <section class="demo-section reveal">
      <app-venue></app-venue>
    </section>

    <app-floral-divider class="reveal"></app-floral-divider>

    <!-- RSVP -->
    <section class="demo-section reveal">
      <p class="rsvp-heading">We would be honoured by your presence</p>
      <app-rsvp-button></app-rsvp-button>
    </section>

    <!-- Footer -->
    <footer class="site-footer reveal">
      <app-monogram></app-monogram>
      <p>Spurgeon & Amulya · June 6, 2026</p>
    </footer>

  </div>

  <router-outlet />

</app-invitation>
