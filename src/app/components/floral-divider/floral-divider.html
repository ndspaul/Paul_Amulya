<div class="floral-divider" aria-hidden="true">
  <svg viewBox="0 0 600 50" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <!-- Left stem -->
    <path class="floral-divider__stem floral-divider__stem--left"
      d="M 100,25 C 150,25 180,20 220,25 C 240,27 260,25 280,25"
      fill="none" stroke="var(--olive-light)" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Right stem -->
    <path class="floral-divider__stem floral-divider__stem--right"
      d="M 500,25 C 450,25 420,20 380,25 C 360,27 340,25 320,25"
      fill="none" stroke="var(--olive-light)" stroke-width="0.6" stroke-linecap="round"/>

    <!-- Left leaves -->
    <path class="floral-divider__leaf floral-divider__leaf--l1"
      d="M 160,25 C 155,15 145,12 140,18 C 145,20 155,22 160,25"
      fill="var(--olive-muted)" stroke="var(--olive-light)" stroke-width="0.4"/>
    <path class="floral-divider__leaf floral-divider__leaf--l2"
      d="M 200,23 C 198,32 190,36 186,30 C 190,28 198,26 200,23"
      fill="var(--olive-muted)" stroke="var(--olive-light)" stroke-width="0.4"/>
    <path class="floral-divider__leaf floral-divider__leaf--l3"
      d="M 240,25 C 235,16 227,14 224,19 C 228,21 236,23 240,25"
      fill="var(--olive-muted)" stroke="var(--olive-light)" stroke-width="0.4"/>

    <!-- Right leaves -->
    <path class="floral-divider__leaf floral-divider__leaf--r1"
      d="M 440,25 C 445,15 455,12 460,18 C 455,20 445,22 440,25"
      fill="var(--olive-muted)" stroke="var(--olive-light)" stroke-width="0.4"/>
    <path class="floral-divider__leaf floral-divider__leaf--r2"
      d="M 400,23 C 402,32 410,36 414,30 C 410,28 402,26 400,23"
      fill="var(--olive-muted)" stroke="var(--olive-light)" stroke-width="0.4"/>
    <path class="floral-divider__leaf floral-divider__leaf--r3"
      d="M 360,25 C 365,16 373,14 376,19 C 372,21 364,23 360,25"
      fill="var(--olive-muted)" stroke="var(--olive-light)" stroke-width="0.4"/>

    <!-- Center bloom -->
    <circle cx="300" cy="25" r="4" fill="none" stroke="var(--gold)" stroke-width="0.6" opacity="0.5"
      class="floral-divider__bloom"/>
    <circle cx="300" cy="25" r="1.5" fill="var(--gold)" opacity="0.4"
      class="floral-divider__bloom-center"/>

    <!-- Center petals -->
    <ellipse class="floral-divider__petal" cx="300" cy="18" rx="2.5" ry="5"
      fill="none" stroke="var(--olive-light)" stroke-width="0.4" opacity="0.4"/>
    <ellipse class="floral-divider__petal" cx="300" cy="32" rx="2.5" ry="5"
      fill="none" stroke="var(--olive-light)" stroke-width="0.4" opacity="0.4"/>
    <ellipse class="floral-divider__petal" cx="293" cy="22" rx="2.5" ry="5" transform="rotate(-40 293 22)"
      fill="none" stroke="var(--olive-light)" stroke-width="0.4" opacity="0.4"/>
    <ellipse class="floral-divider__petal" cx="307" cy="22" rx="2.5" ry="5" transform="rotate(40 307 22)"
      fill="none" stroke="var(--olive-light)" stroke-width="0.4" opacity="0.4"/>
  </svg>
</div>
