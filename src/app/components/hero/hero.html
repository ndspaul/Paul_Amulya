<section class="hero">
  <!-- Looping background video -->
  <video #heroVideo class="hero__video" autoplay muted loop playsinline preload="auto">
    <source src="/hero-bg2.mp4" type="video/mp4" />
  </video>

  <!-- Overlay -->
  <div class="hero__overlay"></div>

  <!-- Content on top of video -->
  <div class="hero__content">
    <p class="hero__pre">We are getting married</p>

    <h1 class="hero__names-text">Spurgeon <span class="amp">&amp;</span> Amulya</h1>

    <p class="hero__date">06 · 06 · 2026</p>

  </div>

  <!-- Scroll down arrow -->
  <div class="hero__scroll" aria-hidden="true">
    <svg class="hero__scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

</section>
