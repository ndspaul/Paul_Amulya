<div class="monogram" aria-label="S & A monogram">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="monogram__svg">
    <!-- Outer decorative ring -->
    <circle class="monogram__ring monogram__ring--outer" cx="100" cy="100" r="92"
      fill="none" stroke="var(--olive-light)" stroke-width="0.5" opacity="0.4"/>

    <!-- Dashed ornamental ring -->
    <circle class="monogram__ring monogram__ring--dashed" cx="100" cy="100" r="86"
      fill="none" stroke="var(--gold)" stroke-width="0.4"
      stroke-dasharray="4 6" opacity="0.5"/>

    <!-- Inner ring -->
    <circle class="monogram__ring monogram__ring--inner" cx="100" cy="100" r="80"
      fill="none" stroke="var(--olive)" stroke-width="0.6" opacity="0.3"/>

    <!-- Top floral accent -->
    <path class="monogram__flourish monogram__flourish--top"
      d="M 70,28 C 80,18 90,22 100,20 C 110,22 120,18 130,28"
      fill="none" stroke="var(--olive-light)" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- Bottom floral accent -->
    <path class="monogram__flourish monogram__flourish--bottom"
      d="M 70,172 C 80,182 90,178 100,180 C 110,178 120,182 130,172"
      fill="none" stroke="var(--olive-light)" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

    <!-- Initials -->
    <text class="monogram__letter monogram__letter--s" x="72" y="118"
      font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="300"
      font-style="italic" fill="var(--text)" text-anchor="middle">S</text>

    <text class="monogram__amp" x="100" y="108"
      font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="300"
      font-style="italic" fill="var(--gold)" text-anchor="middle">&amp;</text>

    <text class="monogram__letter monogram__letter--a" x="128" y="118"
      font-family="'Cormorant Garamond', Georgia, serif" font-size="56" font-weight="300"
      font-style="italic" fill="var(--text)" text-anchor="middle">A</text>

    <!-- Small decorative dots -->
    <circle cx="50" cy="100" r="1.2" fill="var(--gold)" opacity="0.4"/>
    <circle cx="150" cy="100" r="1.2" fill="var(--gold)" opacity="0.4"/>
    <circle cx="100" cy="38" r="1" fill="var(--gold)" opacity="0.3"/>
    <circle cx="100" cy="162" r="1" fill="var(--gold)" opacity="0.3"/>
  </svg>
</div>
