<div class="moment" [class.visible]="isVisible">

  <!-- Top-left photo -->
  <div class="moment__photo moment__photo--left">
    <img src="photo1.jpg" alt="Mehndi rings moment" loading="lazy" decoding="async" />
    <div class="moment__photo-glow"></div>
  </div>

  <!-- Centre quote -->
  <div class="moment__quote">
    <span class="moment__quote-mark">"</span>
    <p class="moment__quote-text">
      Two souls, one heart —<br />bound by love, blessed by God.
    </p>
    <span class="moment__quote-names">Spurgeon &amp; Amulya</span>
    <div class="moment__quote-divider">
      <span></span>✦<span></span>
    </div>
  </div>

  <!-- Bottom-right photo -->
  <div class="moment__photo moment__photo--right">
    <img src="photo2.jpg" alt="Paul and Amulya portrait" loading="lazy" decoding="async" />
    <div class="moment__photo-glow"></div>
  </div>

</div>
