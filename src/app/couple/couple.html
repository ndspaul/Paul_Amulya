<section class="couple-section" [class.visible]="isVisible">

  <div class="couple-section__verse couple-section__verse--top">
    <span class="couple-section__verse-ref">Ruth 1:16</span>
    <p class="couple-section__verse-text">
      "Where you go I will go, and where you stay I will stay.
      Your people will be my people and your God my God."
    </p>
  </div>

  <div class="couple-section__portrait">
    <img src="couple.jpg" alt="Spurgeon & Amulya" loading="lazy" decoding="async" fetchpriority="high" />
  </div>

  <div class="couple-section__verse couple-section__verse--bottom">
    <span class="couple-section__verse-ref">1 Corinthians 13:4–7</span>
    <p class="couple-section__verse-text">
      "Love is patient, love is kind. It does not envy, it does not boast,
      it is not proud. It always protects, always trusts,
      always hopes, always perseveres."
    </p>
  </div>

</section>
